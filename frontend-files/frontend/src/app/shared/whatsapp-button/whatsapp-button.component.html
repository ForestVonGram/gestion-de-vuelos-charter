   class="whatsapp-button"

   aria-label="Contactar por WhatsApp"
   title="WhatsApp - Atención al cliente">

    <path d="M12.006 3.5c4.383 0 7.956 3.572 7.956 7.955 0 4.384-3.573 7.956-7.956 7.956-1.474 0-2.879-.405-4.108-1.172l-3.647 1.105 1.103-3.647c-.788-1.235-1.206-2.647-1.206-4.117 0-4.383 3.573-7.955 7.956-7.955z" fill="white" stroke="white" stroke-width="0.5"/>
    <path d="M15.5 13.8c-.3-.15-1.7-.85-1.9-.95-.2-.1-.4-.15-.6.15-.2.3-.7.95-.9 1.15-.2.2-.4.2-.7.05-.3-.15-1.2-.45-2.3-1.45-.8-.75-1.4-1.7-1.6-2-.2-.3-.1-.5.1-.7.2-.2.3-.4.4-.6.1-.2.1-.4 0-.6-.1-.2-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.1 0 1.2.9 2.4 1 2.6.1.2 1.7 2.6 4.1 3.6.6.3 1 .4 1.4.5.6.1 1.1.1 1.6 0 .5-.1 1.6-.6 1.8-1.3.2-.6.2-1.2.1-1.3-.1-.1-.3-.1-.5-.2z" fill="currentColor"/>
  </svg>

  <!-- Anillos de destello -->
  <span class="pulse-ring"></span>
  <span class="pulse-ring-delayed"></span>

  <!-- Tooltip -->
  <span class="whatsapp-tooltip">¡Contáctanos por WhatsApp!</span>
</a>
