<div class="dashboard-container">
  <nav class="navbar">
    <div class="navbar-left">
      <a routerLink="/" class="navbar-left-link">
        <div class="logo-container">
          <img src="assets/logo/logo_astranimbus_svg.svg" alt="Astra Nimbus Logo" class="logo-header" />
        </div>
        <div class="navbar-text">
          <h1 class="navbar-title">Astra Nimbus</h1>
          <p class="navbar-subtitle">Aviation</p>
        </div>
      </a>
    </div>

    <div class="nav-links">
      <a routerLink="/servicios">Servicios</a>
      <a routerLink="/sobre-nosotros">Sobre nosotros</a>

      <button class="theme-toggle" (click)="toggleDarkMode()" [attr.aria-label]="isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
        <span class="theme-toggle-icon">
          <svg *ngIf="!isDarkMode" class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 20V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 12L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M22 12L20 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19.7778 4.22217L18.3636 5.63639" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M5.6364 18.3639L4.22218 19.7781" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19.7778 19.7778L18.3636 18.3636" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M5.6364 5.63605L4.22218 4.22183" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="isDarkMode" class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>

      <div class="user-profile-container">
        <div class="user-avatar" (click)="toggleDropdown()" [class.active]="isDropdownOpen">
          <img
            src="assets/icons/user_account.svg"
            alt="PerfilComponent"
            class="avatar-img"
            onerror="this.src='https://i.pravatar.cc/150?img=68'"
          >
        </div>

        <div class="dropdown-menu" *ngIf="isDropdownOpen">
          <div class="menu-header">
            <span class="menu-user-name">{{ userName }}</span>
            <span class="menu-user-email">{{ userEmail }}</span>
          </div>

          <div class="menu-divider"></div>

          <a routerLink="/profile" class="menu-item">
            <i class="fas fa-user-circle"></i> Mi Perfil
          </a>
          <a href="#" class="menu-item">
            <i class="fas fa-ticket-alt"></i> Mis Vuelos
          </a>
          <a href="#" class="menu-item">
            <i class="fas fa-cog"></i> Configuración
          </a>

          <div class="menu-divider"></div>

          <a (click)="logout()" class="menu-item logout-item">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
          </a>
        </div>
      </div>
    </div>
  </nav>

  <section class="hero-section">
    <div class="search-widget">
      <div class="input-group">
        <label>¿Dónde estás?</label>
        <select class="custom-select">
          <option>Armenia</option>
          <option>Bogotá</option>
          <option>Medellín</option>
        </select>
      </div>

      <div class="divider"></div>

      <div class="input-group">
        <label>¿A dónde vas?</label>
        <select class="custom-select">
          <option>Bogotá</option>
          <option>Cartagena</option>
          <option>Miami</option>
        </select>
      </div>

      <div class="divider"></div>

      <div class="input-group small">
        <label>¿Cuántos son?</label>
        <select class="custom-select">
          <option>1</option>
          <option>2</option>
          <option>5</option>
        </select>
      </div>

      <button class="search-btn" (click)="onSearchFlight()">
        Buscar Vuelo
      </button>
    </div>
  </section>

  <section class="content-section">
    <div class="welcome-text">
      <h1>Bienvenido {{ userName }}</h1>
      <p>Tenemos una amplia flota de aviones esperando para ti</p>
    </div>

    <div class="fleet-showcase">
      <div class="fleet-circle" *ngFor="let img of fleetImages">
        <img [src]="img" alt="Avión de la flota" onerror="this.src='https://via.placeholder.com/200/5C5C99/FFFFFF?text=Avion'">
      </div>
    </div>
  </section>
</div>
