<div class="login-container">
  <a routerLink="/auth/login" class="back-btn" title="Volver al login">
    <svg class="back-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <div class="login-wrapper">
    <div class="logo-section">
      <img src="assets/logo/logo_astranimbus_svg.svg" alt="AstraNimbus Logo" class="logo" height="800" width="800"/>
      <h1 class="app-title">AstraNimbus</h1>
      <p class="app-subtitle">Verificación en dos pasos</p>
    </div>

    <!-- Step Indicator (solo dos pasos) -->
    <div class="step-indicator">
      <div class="step completed">
        <span class="step-number">1</span>
        <span class="step-label">Login</span>
      </div>
      <div class="step-line"></div>
      <div class="step active">
        <span class="step-number">2</span>
        <span class="step-label">Verificación</span>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="error-message">
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ error }}</span>
    </div>

    <form [formGroup]="verificationForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="codigo" class="form-label">Código de verificación</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="3" y1="15" x2="21" y2="15"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          <input
            type="text"
            id="codigo"
            formControlName="codigo"
            class="form-input code-input"
            placeholder="000000"
            maxlength="6"
            inputmode="numeric"
            pattern="\d*"
            [ngClass]="{'is-invalid': submitted && verificationForm.get('codigo')?.errors}"
            (input)="onCodeInput($event)"
          />
        </div>
        <div *ngIf="submitted && verificationForm.get('codigo')?.errors" class="error-text">
          <span *ngIf="verificationForm.get('codigo')?.errors?.['required']">El código es obligatorio</span>
          <span *ngIf="verificationForm.get('codigo')?.errors?.['pattern']">El código debe tener 6 dígitos</span>
        </div>
      </div>

      <div class="countdown-timer">
        <span>El código expira en: </span>
        <strong>{{ formatTime(countdown) }}</strong>
      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="loading"
        [ngClass]="{ 'loading': loading }"
      >
        <span *ngIf="!loading">Verificar código</span>
        <span *ngIf="loading" class="spinner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v4m0 12v4M2 12h4m12 0h4" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
    </form>

    <div class="register-link">
      <p>¿No recibiste el código?
        <a href="#" (click)="resendCode($event)" class="link">Reenviar código</a>
      </p>
    </div>
  </div>
</div>
<app-accesibilidad></app-accesibilidad>
