# Test Configuration - Base de datos de prueba
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Test Configuration
jwt.secret=test-secret-key-for-testing-only-this-is-a-very-long-secret
jwt.expiration=3600000

# Email Configuration - Test SMTP (no envía realmente)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# MercadoPago Test Configuration
# Usa token de prueba de MercadoPago
mercadopago.token=TEST-1234567890abcdefghijklmnopqrst
mercadopago.success-url=http://localhost:4200/pagos/exito
mercadopago.pending-url=http://localhost:4200/pagos/pendiente
mercadopago.failure-url=http://localhost:4200/pagos/error
mercadopago.webhook-url=http://localhost:8080/api/pagos/webhook

# Cloudinary Test Configuration
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

# App Configuration
app.frontend.url=http://localhost:4200

# 2FA Test Configuration
2fa.code-expiration-minutes=10
2fa.max-attempts=3

# reCAPTCHA Test Configuration (disabled for tests)
recaptcha.enabled=false
recaptcha.secret-key=test-secret
recaptcha.score-threshold=0.5
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Logging
logging.level.root=WARN
logging.level.com.paeldav.backend=DEBUG
logging.level.org.springframework.test.context=INFO
logging.level.org.hibernate.SQL=DEBUG
