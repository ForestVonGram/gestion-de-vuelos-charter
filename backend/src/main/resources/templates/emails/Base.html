<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo}">AstraNimbus Aviation</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<div th:fragment="layout(titulo, contenido)">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;padding:40px 16px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

                    <!-- HEADER -->
                    <tr>
                        <td style="background:#1e3a6b;border-radius:12px 12px 0 0;padding:32px 40px;text-align:center;">
                            <p style="margin:0;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:1px;">
                                ✈ AstraNimbus Aviation
                            </p>
                            <p style="margin:6px 0 0;font-size:13px;color:#93c5fd;">
                                Charter Management System
                            </p>
                        </td>
                    </tr>

                    <!-- BODY -->
                    <tr>
                        <td style="background:#ffffff;padding:40px;color:#374151;font-size:15px;line-height:1.7;">
                            <h2 style="margin:0 0 24px 0;font-size:20px;color:#111827;" th:text="${titulo}">Título</h2>

                            <!-- El contenido específico de cada correo se inserta aquí -->
                            <th:block th:replace="${contenido}"/>
                        </td>
                    </tr>

                    <!-- FOOTER -->
                    <tr>
                        <td style="background:#f9fafb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;padding:24px 40px;text-align:center;">
                            <p style="margin:0 0 4px;font-size:12px;color:#9ca3af;">
                                © 2025 AstraNimbus Aviation. Todos los derechos reservados.
                            </p>
                            <p style="margin:0;font-size:12px;color:#9ca3af;">
                                Este es un correo automático, por favor no respondas a este mensaje.
                            </p>
                        </td>
                    </tr>


                </table>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
