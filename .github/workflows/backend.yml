name: backend.yml

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x backend/gradlew

      - name: Build executable JAR
        run: ./gradlew clean bootJar
        working-directory: backend

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          if-no-files-found: error
          retention-days: 5

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: EC2

    env:
      EC2_HOST: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER || vars.EC2_USER }}

    steps:
      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: deploy

      - name: Validate deployment configuration
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_HOST}" ]; then
            echo "EC2_HOST is required. Configure it as a GitHub secret or variable."
            exit 1
          fi

          if [ -z "${EC2_USER}" ]; then
            echo "EC2_USER is required. Configure it as a GitHub secret or variable."
            exit 1
          fi

          if [ -z "${EC2_PRIVATE_KEY}" ]; then
            echo "EC2_PRIVATE_KEY is required. Configure it as a GitHub secret."
            exit 1
          fi

      - name: Configure SSH key
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if printf '%s' "${EC2_PRIVATE_KEY}" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "${EC2_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/anpem.pem
          else
            {
              echo "-----BEGIN RSA PRIVATE KEY-----"
              printf '%s' "${EC2_PRIVATE_KEY}" | tr -d '\r\n ' | fold -w 64
              echo "-----END RSA PRIVATE KEY-----"
            } > ~/.ssh/anpem.pem
          fi

          chmod 600 ~/.ssh/anpem.pem

          HOST_FOR_SCAN="${EC2_HOST#*@}"
          ssh-keyscan -T 10 -H "${HOST_FOR_SCAN}" >> ~/.ssh/known_hosts || true

      - name: Deploy JAR to EC2
        run: |
          set -euo pipefail

          JAR_FILE="$(find deploy -maxdepth 1 -type f -name '*.jar' -print -quit)"

          if [ -z "${JAR_FILE}" ]; then
            echo "No JAR file found in deploy/."
            exit 1
          fi

          if [[ "${EC2_HOST}" == *"@"* ]]; then
            SSH_TARGET="${EC2_HOST}"
          else
            SSH_TARGET="${EC2_USER}@${EC2_HOST}"
          fi

          echo "Deploying backend artifact to ${SSH_TARGET}"

          scp \
            -i ~/.ssh/anpem.pem \
            -o StrictHostKeyChecking=yes \
            "${JAR_FILE}" \
            "${SSH_TARGET}:/tmp/astranimbus-app.jar"

          ssh \
            -i ~/.ssh/anpem.pem \
            -o StrictHostKeyChecking=yes \
            "${SSH_TARGET}" << 'EOF'
          set -euo pipefail

          SERVICE_NAME="astranimbus"
          APP_DIR="/opt/astranimbus"
          APP_JAR="${APP_DIR}/app.jar"
          BACKUP_JAR="${APP_DIR}/app.jar.backup"
          NEW_JAR="/tmp/astranimbus-app.jar"
          HEALTHCHECK_URL="http://localhost:8081/api/actuator/health"

          echo "Preparing backend deployment..."
          sudo mkdir -p "${APP_DIR}/logs"
          sudo chown -R ec2-user:ec2-user "${APP_DIR}/logs"
                              
          if [ -f "${APP_JAR}" ]; then
            sudo cp "${APP_JAR}" "${BACKUP_JAR}"
          fi
          
          echo "Stopping ${SERVICE_NAME} service..."
          sudo systemctl stop "${SERVICE_NAME}" || true
          
          echo "Installing new backend JAR..."
          sudo cp "${NEW_JAR}" "${APP_JAR}"
          sudo chmod 644 "${APP_JAR}"
          sudo chown ec2-user:ec2-user "${APP_JAR}"
          
          sudo systemctl daemon-reload
          
          echo "Starting ${SERVICE_NAME} service..."
          sudo systemctl start "${SERVICE_NAME}"

          echo "Waiting for backend health check..."
          for attempt in $(seq 1 18); do
            if curl -fsS "${HEALTHCHECK_URL}" >/dev/null; then
              echo "Backend deployment completed successfully."
              sudo rm -f "${NEW_JAR}"
              exit 0
            fi

            echo "Health check attempt ${attempt}/18 failed; retrying..."
            sleep 5
          done

          echo "Backend health check failed. Rolling back..."
          sudo journalctl -u "${SERVICE_NAME}" -n 80 --no-pager || true
          sudo systemctl stop "${SERVICE_NAME}" || true

          if [ -f "${BACKUP_JAR}" ]; then
            sudo cp "${BACKUP_JAR}" "${APP_JAR}"

            if id "${SERVICE_NAME}" >/dev/null 2>&1; then
              sudo chown "${SERVICE_NAME}:${SERVICE_NAME}" "${APP_JAR}"
            fi

            sudo systemctl start "${SERVICE_NAME}" || true
          fi

          exit 1
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/anpem.pem
