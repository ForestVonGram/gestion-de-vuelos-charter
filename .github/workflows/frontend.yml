name: frontend.yml

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 20.x
  # Path relative to the root of the repository
  BUILD_DIR: frontend-files/frontend/dist/frontend/browser
  WORKING_DIR: frontend-files/frontend

jobs:
  build:
    name: Build Angular app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WORKING_DIR }}

      - name: Build production bundle
        run: npm run build -- --configuration production
        working-directory: ${{ env.WORKING_DIR }}

      - name: Prepare S3 entry point
        run: |
          if [ ! -f "${BUILD_DIR}/index.html" ] && [ -f "${BUILD_DIR}/index.csr.html" ]; then
            cp "${BUILD_DIR}/index.csr.html" "${BUILD_DIR}/index.html"
          fi

      - name: Verify build output
        run: test -f "${BUILD_DIR}/index.html"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error
          retention-days: 5

  deploy:
    name: Deploy frontend to S3
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: S3
    concurrency:
      group: frontend-production
      cancel-in-progress: true

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.BUILD_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync static assets to S3
        run: >
          aws s3 sync "${BUILD_DIR}" "s3://${{ secrets.S3_BUCKET_NAME }}"
          --delete
          --exclude "*.html"
          --cache-control "public,max-age=31536000,immutable"

      - name: Sync HTML files to S3
        run: >
          aws s3 sync "${BUILD_DIR}" "s3://${{ secrets.S3_BUCKET_NAME }}"
          --exclude "*"
          --include "*.html"
          --cache-control "no-cache,no-store,must-revalidate"
          --content-type "text/html"

      - name: Configure S3 static website hosting
        run: >
          aws s3 website "s3://${{ secrets.S3_BUCKET_NAME }}"
          --index-document index.html
          --error-document index.html
